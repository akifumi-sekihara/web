packages:
  - apps/*
  - packages/*
packageExtensions:
  "intl-messageformat@10.7.18":
    dependencies:
      tslib: ^2.8.1
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  lefthook: true
catalog:
  typescript: ^7.0.2
  "@types/node": ^24.0.0
# Miniflare pins a vulnerable sharp; remove once upstream ships >=0.35.4.
# https://github.com/advisories/GHSA-rgj7-g3m4-5g8c
overrides:
  "miniflare>sharp": 0.35.4
