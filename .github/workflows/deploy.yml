name: Deploy verified site
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run on main whose site artifact should be deployed
        required: true
      target:
        type: choice
        options: [upload-only, production]
        default: upload-only
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Validate CI provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$REPO/actions/runs/$RUN_ID")
          test "$(jq -r .conclusion <<< "$run")" = success
          test "$(jq -r .head_branch <<< "$run")" = main
          test "$(jq -r .path <<< "$run")" = .github/workflows/ci.yml
          test "$(jq -r .head_repository.full_name <<< "$run")" = "$REPO"
          echo "sha=$(jq -r .head_sha <<< "$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: apps/portfolio/dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Upload unpublished version (preview URLs are disabled)
        if: inputs.target == 'upload-only'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler versions upload
      - name: Deploy production
        if: inputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Production smoke check
        if: inputs.target == 'production'
        run: |
          curl --fail --retry 3 https://portfolio.sekihara.dev/en/ -o /dev/null
          curl --fail --retry 3 https://portfolio.sekihara.dev/sitemap-index.xml -o /dev/null
