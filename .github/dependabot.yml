version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      stylex:
        patterns: ["@stylexjs/*"]
      quality:
        patterns:
          ["vite-plus", "oxlint", "oxfmt", "oxlint-tsgolint", "ultracite"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
